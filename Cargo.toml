[package]
name = "usbtetherd"
version = "0.1.1"
edition = "2024"
description = "Trimmed macOS userspace RNDIS USB-tethering daemon that only connects phones on an approved-phone allowlist, with a local control socket for approvals"
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
libc = "0.2.190"
nusb = "0.2.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
