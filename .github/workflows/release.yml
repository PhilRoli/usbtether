name: Release

# Releases come from four places:
#  - a pushed v* tag (manual releases, e.g. the first v0.1.0 or minor/major bumps)
#  - a successful CI run on main (workflow_run), and
#  - a schedule (safety net: events caused by GITHUB_TOKEN, such as an
#    auto-merge enabled with it, do not trigger push/workflow_run workflows).
#    Both release automatically when Cargo.lock or app/Package.resolved changed
#    since the latest stable tag, as a patch release.
#  - workflow_dispatch, which only ever does a dry run (package, no publish)
#
# Two jobs on purpose: `build` runs dependency build scripts and holds no
# secrets and no write permission; `publish` holds the tokens and never runs
# cargo, swift or packaging code.
on:
  push:
    tags: ['v[0-9]*']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package only; never tag, release or touch the tap
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    if: >-
      github.event_name != 'workflow_run' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      mode: ${{ steps.plan.outputs.mode }}
      dry: ${{ steps.plan.outputs.dry }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      # workflow_run: the CI-tested commit. schedule: main. Otherwise the triggering ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || (github.event_name == 'schedule' && 'main' || '') }}
          fetch-depth: 0
          persist-credentials: false

      # The only token here is the read-only GITHUB_TOKEN, scoped to this step
      # (no dependency code has run yet); it is used for a best-effort
      # "already released" check so a tagged HEAD is not rebuilt every 6 hours.
      # If the tap is not readable with it, the check is unknown and we build.
      - name: Plan release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release-plan.sh

      - name: Test daemon
        if: ${{ steps.plan.outputs.release == 'true' }}
        run: cargo test

      - name: Test app
        if: ${{ steps.plan.outputs.release == 'true' }}
        run: swift test
        working-directory: app

      - name: Add Rust targets
        if: ${{ steps.plan.outputs.release == 'true' }}
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Package app
        id: package
        if: ${{ steps.plan.outputs.release == 'true' }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          scripts/package.sh "$VERSION"
          archive="build/UsbTether-$VERSION.zip"
          [ -f "$archive" ] || { echo "$archive was not produced" >&2; exit 1; }
          sha256="$(shasum -a 256 "$archive" | cut -d' ' -f1)"
          prerelease=false
          [[ "$VERSION" == *-* ]] && prerelease=true
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "sha256=$sha256"
            echo "prerelease=$prerelease"
            echo "mode=$MODE"
          } > build/release-info.txt
          echo "$archive"
          echo "sha256: $sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload release files
        if: ${{ steps.plan.outputs.release == 'true' && steps.plan.outputs.dry != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: release
          overwrite: true
          path: |
            ${{ steps.package.outputs.archive }}
            build/release-info.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    if: ${{ needs.build.outputs.release == 'true' && needs.build.outputs.dry != 'true' }}
    runs-on: macos-latest
    permissions:
      contents: write
    # Serialised here (not workflow-wide) so skipped or no-op runs cannot cancel a pending publish.
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.build.outputs.version }}
      MODE: ${{ needs.build.outputs.mode }}
      COMMIT: ${{ needs.build.outputs.commit }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The build job ran dependency code: its outputs are untrusted input.
      - name: Validate build outputs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid version $VERSION" >&2; exit 1
          fi
          if [ "$MODE" != new ] && [ "$MODE" != resume ]; then
            echo "Invalid mode $MODE" >&2; exit 1
          fi
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid commit $COMMIT" >&2; exit 1
          fi
          if [ "$EVENT" = push ]; then
            # A tag push releases exactly the commit the tag points at.
            tag_commit="$(gh api "repos/$GH_REPO/commits/v$VERSION" --jq .sha)"
            [ "$tag_commit" = "$COMMIT" ] || { echo "Tag v$VERSION is at $tag_commit, not $COMMIT" >&2; exit 1; }
          else
            # Automatic releases only ever publish code that is on main.
            status="$(gh api "repos/$GH_REPO/compare/main...$COMMIT" --jq .status)"
            if [ "$status" != behind ] && [ "$status" != identical ]; then
              echo "Commit $COMMIT is not reachable from main (compare status: $status)" >&2; exit 1
            fi
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Verify artifact
        id: info
        run: |
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          zip="dist/UsbTether-$VERSION.zip"
          [ -f "$zip" ] || { echo "$zip is missing" >&2; exit 1; }
          get() { grep -m1 "^$1=" dist/release-info.txt | cut -d= -f2-; }
          [ "$(get version)" = "$VERSION" ] || { echo "release-info version mismatch" >&2; exit 1; }
          [ "$(get tag)" = "v$VERSION" ] || { echo "release-info tag mismatch" >&2; exit 1; }
          [ "$(get mode)" = "$MODE" ] || { echo "release-info mode mismatch" >&2; exit 1; }
          expected="$(get sha256)"
          actual="$(shasum -a 256 "$zip" | cut -d' ' -f1)"
          [[ "$actual" =~ ^[0-9a-f]{64}$ ]] || { echo "bad checksum" >&2; exit 1; }
          if [ "$actual" != "$expected" ]; then
            echo "SHA-256 mismatch: release-info $expected, zip $actual" >&2
            exit 1
          fi
          prerelease=false
          tap=true
          if [[ "$VERSION" == *-* ]]; then prerelease=true; tap=false; fi
          echo "$zip sha256 $actual (prerelease=$prerelease)"
          out zip "$zip"
          out name "UsbTether-$VERSION.zip"
          out sha256 "$actual"
          out prerelease "$prerelease"
          out tap "$tap"

      # Prereleases never reach the Homebrew tap.
      - name: Verify tap token
        if: ${{ steps.info.outputs.tap == 'true' }}
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "HOMEBREW_TAP_TOKEN is not set" >&2; exit 1; }

      - name: Checkout homebrew-tap
        if: ${{ steps.info.outputs.tap == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          persist-credentials: false

      # Fail before anything is published if the tap update cannot succeed.
      - name: Verify cask and tap push access
        if: ${{ steps.info.outputs.tap == 'true' }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -f homebrew-tap/Casks/usbtether.rb ] || { echo "homebrew-tap/Casks/usbtether.rb not found" >&2; exit 1; }
          encoded="$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64)"
          echo "::add-mask::$encoded"
          header="AUTHORIZATION: basic $encoded"
          echo "::add-mask::$header"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="$header"
          git -C homebrew-tap push --dry-run origin HEAD

      # Everything below decides from the live state (release, assets, cask), not
      # from cached build outputs, so re-running only this job finishes a partial run.
      - name: Inspect existing release
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
          NAME: ${{ steps.info.outputs.name }}
          TAP: ${{ steps.info.outputs.tap }}
          SHA256: ${{ steps.info.outputs.sha256 }}
        run: |
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          release_exists=false
          asset_present=false
          is_draft=false
          # The hash users actually download wins over the one just built.
          cask_sha="$SHA256"
          if assets="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>"$RUNNER_TEMP/gh-err")"; then
            release_exists=true
            is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            if grep -Fxq "$NAME" <<<"$assets"; then
              asset_present=true
              mkdir "$RUNNER_TEMP/existing"
              gh release download "$TAG" --pattern "$NAME" --dir "$RUNNER_TEMP/existing"
              cask_sha="$(shasum -a 256 "$RUNNER_TEMP/existing/$NAME" | cut -d' ' -f1)"
            fi
          elif ! grep -qi 'not found' "$RUNNER_TEMP/gh-err"; then
            cat "$RUNNER_TEMP/gh-err" >&2
            exit 1
          fi
          cask_current=false
          if [ "$TAP" = true ]; then
            cask=homebrew-tap/Casks/usbtether.rb
            current="$(grep -m1 -E '^  version "' "$cask" | cut -d'"' -f2)"
            current_sha="$(grep -m1 -E '^  sha256 "' "$cask" | cut -d'"' -f2)"
            if [ "$current" = "$VERSION" ] && [ "$current_sha" = "$cask_sha" ]; then cask_current=true; fi
          fi
          complete=false
          if [ "$release_exists" = true ] && [ "$is_draft" != true ] && [ "$asset_present" = true ] \
            && { [ "$TAP" != true ] || [ "$cask_current" = true ]; }; then
            complete=true
            echo "$TAG is already released (release asset present, cask current), nothing to do."
          fi
          echo "release_exists=$release_exists draft=$is_draft asset_present=$asset_present cask_current=$cask_current"
          out release_exists "$release_exists"
          out is_draft "$is_draft"
          out asset_present "$asset_present"
          out cask_current "$cask_current"
          out cask_sha "$cask_sha"
          out complete "$complete"

      # A tag pushed with GITHUB_TOKEN does not trigger another workflow run.
      # The remote decides: an existing tag at the built commit is fine (re-run),
      # one elsewhere is an error.
      - name: Create and push tag
        if: ${{ steps.state.outputs.complete != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          encoded="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64)"
          echo "::add-mask::$encoded"
          header="AUTHORIZATION: basic $encoded"
          echo "::add-mask::$header"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="$header"
          remote="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          if [ -n "$remote" ]; then
            # An annotated tag lists the tag object and, peeled, its commit; prefer the peeled line.
            remote_commit="$(awk '$2 ~ /\^\{\}$/ {print $1}' <<<"$remote")"
            [ -n "$remote_commit" ] || remote_commit="$(awk '{print $1}' <<<"$remote" | head -n 1)"
            if [ "$remote_commit" = "$COMMIT" ]; then
              echo "Tag $TAG already points at $COMMIT, not pushing."
              exit 0
            fi
            echo "Tag $TAG exists at $remote_commit, expected $COMMIT" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$COMMIT"
          git push origin "refs/tags/$TAG"

      # Never overwrite a published asset (the cask must match what users download);
      # release notes are left untouched.
      - name: Create or complete GitHub release
        if: ${{ steps.state.outputs.complete != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
          ZIP: ${{ steps.info.outputs.zip }}
          NAME: ${{ steps.info.outputs.name }}
          SHA256: ${{ steps.info.outputs.sha256 }}
          PRERELEASE: ${{ steps.info.outputs.prerelease }}
          RELEASE_EXISTS: ${{ steps.state.outputs.release_exists }}
          ASSET_PRESENT: ${{ steps.state.outputs.asset_present }}
          IS_DRAFT: ${{ steps.state.outputs.is_draft }}
        run: |
          if [ "$RELEASE_EXISTS" != true ]; then
            printf '%s\n' "SHA-256 (\`$NAME\`): \`$SHA256\`" > "$RUNNER_TEMP/notes.md"
            args=(--title "$TAG" --generate-notes --notes-file "$RUNNER_TEMP/notes.md" --verify-tag)
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
            gh release create "$TAG" "$ZIP" "${args[@]}"
            exit 0
          fi
          if [ "$ASSET_PRESENT" != true ]; then
            gh release upload "$TAG" "$ZIP"
          fi
          if [ "$IS_DRAFT" = true ]; then
            gh release edit "$TAG" --draft=false
          fi

      - name: Update cask in tap
        if: ${{ steps.info.outputs.tap == 'true' && steps.state.outputs.cask_current != 'true' }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          CASK_SHA: ${{ steps.state.outputs.cask_sha }}
        run: |
          scripts/update-cask.py homebrew-tap/Casks/usbtether.rb "$VERSION" "$CASK_SHA"
          # The auth header is only exported once the (token-free) updater has run.
          encoded="$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64)"
          echo "::add-mask::$encoded"
          header="AUTHORIZATION: basic $encoded"
          echo "::add-mask::$header"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="$header"
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/usbtether.rb
          git diff --staged --quiet || git commit -m "usbtether v$VERSION"
          for _ in 1 2 3; do
            git push origin HEAD && exit 0
            git pull --rebase
          done
          echo "Failed to push cask update after 3 attempts" >&2
          exit 1
