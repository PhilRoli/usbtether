name: Release

# Releases are manual: push a vX.Y.Z[-suffix] tag. Prerelease tags skip the tap.
# If publish fails after the release exists, delete the release and re-run, or
# finish the cask update by hand. workflow_dispatch only does a dry run (build).
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package only; never release or touch the tap
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# build runs dependency build scripts, so it holds no secrets and no write access.
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
      prerelease: ${{ steps.package.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: cargo test

      - run: swift test
        working-directory: app

      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Package app
        id: package
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$DRY_RUN" = true ] || { echo "Dispatch only supports dry runs; push a tag to release." >&2; exit 1; }
            VERSION=0.0.0-dryrun
          else
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
              echo "Tag $REF_NAME is not vMAJOR.MINOR.PATCH[-suffix]" >&2
              exit 1
            fi
            VERSION="${REF_NAME#v}"
          fi
          scripts/package.sh "$VERSION"
          sha256="$(shasum -a 256 "build/UsbTether-$VERSION.zip" | cut -d' ' -f1)"
          printf 'version=%s\nsha256=%s\n' "$VERSION" "$sha256" > build/release-info.txt
          echo "build/UsbTether-$VERSION.zip sha256 $sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@v7
        with:
          name: release
          overwrite: true
          path: |
            build/UsbTether-${{ steps.package.outputs.version }}.zip
            build/release-info.txt
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Verify artifact
        run: |
          expected="$(grep -m1 '^sha256=' dist/release-info.txt | cut -d= -f2-)"
          actual="$(shasum -a 256 "dist/UsbTether-$VERSION.zip" | cut -d' ' -f1)"
          [ "$actual" = "$expected" ] || { echo "SHA-256 mismatch: $expected vs $actual" >&2; exit 1; }
          echo "$actual" > "$RUNNER_TEMP/sha256"

      - name: Verify tap token
        if: ${{ needs.build.outputs.prerelease == 'false' }}
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: '[ -n "$TOKEN" ] || { echo "HOMEBREW_TAP_TOKEN is not set" >&2; exit 1; }'

      - name: Checkout homebrew-tap
        if: ${{ needs.build.outputs.prerelease == 'false' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          persist-credentials: false

      # Fail before publishing if the tap update cannot succeed.
      - name: Verify cask and tap push access
        if: ${{ needs.build.outputs.prerelease == 'false' }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -f homebrew-tap/Casks/usbtether.rb ] || { echo "usbtether.rb not found in tap" >&2; exit 1; }
          encoded="$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64)"
          header="AUTHORIZATION: basic $encoded"
          echo "::add-mask::$encoded"
          echo "::add-mask::$header"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="$header"
          git -C homebrew-tap push --dry-run origin HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "SHA-256 (\`UsbTether-$VERSION.zip\`): \`$(cat "$RUNNER_TEMP/sha256")\`" > "$RUNNER_TEMP/notes.md"
          args=(--title "$TAG" --generate-notes --notes-file "$RUNNER_TEMP/notes.md" --verify-tag)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$TAG" "dist/UsbTether-$VERSION.zip" "${args[@]}"

      - name: Update cask in tap
        if: ${{ needs.build.outputs.prerelease == 'false' }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          scripts/update-cask.py homebrew-tap/Casks/usbtether.rb "$VERSION" "$(cat "$RUNNER_TEMP/sha256")"
          # The auth header is only exported once the token-free updater has run.
          encoded="$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64)"
          header="AUTHORIZATION: basic $encoded"
          echo "::add-mask::$encoded"
          echo "::add-mask::$header"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="$header"
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/usbtether.rb
          git diff --staged --quiet || git commit -m "usbtether v$VERSION"
          for _ in 1 2 3; do
            git push origin HEAD && exit 0
            git pull --rebase
          done
          echo "Failed to push cask update after 3 attempts" >&2
          exit 1
