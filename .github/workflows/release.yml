name: Release

# Releases are manual: push a vX.Y.Z tag on a commit that is on main, or a
# vX.Y.Z-suffix prerelease tag on any commit (prereleases skip the tap).
# workflow_dispatch only does a dry run (build).
# If publish fails after the release was created (a failed asset upload leaves a
# stray draft), delete only the release, keeping the tag:
#   gh release delete vX.Y.Z      (no --cleanup-tag)
# then use "Re-run failed jobs". Or finish the cask by hand in a tap checkout:
#   <usbtether>/scripts/update-cask.py Casks/usbtether.rb X.Y.Z <sha from the release notes>
# and commit and push there.
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package only; never release or touch the tap
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# build runs dependency build scripts, so it holds no secrets and no write access.
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: cargo test --locked

      - run: swift test
        working-directory: app

      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Package app
        id: package
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$DRY_RUN" = true ] || { echo "Dispatch only supports dry runs; push a tag to release." >&2; exit 1; }
            VERSION=0.0.0-dryrun
          else
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
              echo "Tag $REF_NAME is not vMAJOR.MINOR.PATCH[-suffix]" >&2
              exit 1
            fi
            VERSION="${REF_NAME#v}"
          fi
          scripts/package.sh "$VERSION"
          sha256="$(shasum -a 256 "build/UsbTether-$VERSION.zip" | cut -d' ' -f1)"
          printf 'version=%s\nsha256=%s\n' "$VERSION" "$sha256" > build/release-info.txt
          echo "build/UsbTether-$VERSION.zip sha256 $sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          overwrite: true
          path: |
            build/UsbTether-${{ steps.package.outputs.version }}.zip
            build/release-info.txt
          if-no-files-found: error

  # VERSION and PRERELEASE come from the tag here, never from build's outputs: build
  # runs dependency build scripts, which can write to its $GITHUB_OUTPUT.
  publish:
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Tag $TAG is not vMAJOR.MINOR.PATCH[-suffix]" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          # A full release reaches every `brew upgrade`: only commits already on main
          # (and so through CI) qualify. Prereleases may come from a release branch.
          if [ "$PRERELEASE" = false ]; then
            status="$(gh api "repos/$GH_REPO/compare/main...$GITHUB_SHA" --jq .status)"
            case "$status" in
              identical|behind) ;;
              *) echo "Tag $TAG ($GITHUB_SHA) is not on main (compare: $status)" >&2; exit 1 ;;
            esac
          fi
          printf 'VERSION=%s\nPRERELEASE=%s\n' "$VERSION" "$PRERELEASE" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Verify artifact
        run: |
          expected="$(grep -m1 '^sha256=' dist/release-info.txt | cut -d= -f2-)"
          actual="$(shasum -a 256 "dist/UsbTether-$VERSION.zip" | cut -d' ' -f1)"
          [ "$actual" = "$expected" ] || { echo "SHA-256 mismatch: $expected vs $actual" >&2; exit 1; }
          echo "$actual" > "$RUNNER_TEMP/sha256"

      - name: Verify tap token
        if: ${{ env.PRERELEASE == 'false' }}
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: '[ -n "$TOKEN" ] || { echo "HOMEBREW_TAP_TOKEN is not set" >&2; exit 1; }'

      - name: Checkout homebrew-tap
        if: ${{ env.PRERELEASE == 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          persist-credentials: false

      # Fail before publishing if the tap update cannot succeed.
      - name: Verify cask and tap push access
        if: ${{ env.PRERELEASE == 'false' }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -f homebrew-tap/Casks/usbtether.rb ] || { echo "usbtether.rb not found in tap" >&2; exit 1; }
          encoded="$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 | tr -d '\n')"
          header="AUTHORIZATION: basic $encoded"
          echo "::add-mask::$encoded"
          echo "::add-mask::$header"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="$header"
          git -C homebrew-tap push --dry-run origin HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "SHA-256 (\`UsbTether-$VERSION.zip\`): \`$(cat "$RUNNER_TEMP/sha256")\`" > "$RUNNER_TEMP/notes.md"
          args=(--title "$TAG" --generate-notes --notes-file "$RUNNER_TEMP/notes.md" --verify-tag)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$TAG" "dist/UsbTether-$VERSION.zip" "${args[@]}"

      - name: Update cask in tap
        if: ${{ env.PRERELEASE == 'false' }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # Build the auth header into unexported variables and drop the token from the
          # environment, so the updater runs without it; git gets the header afterwards.
          encoded="$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 | tr -d '\n')"
          header="AUTHORIZATION: basic $encoded"
          echo "::add-mask::$encoded"
          echo "::add-mask::$header"
          unset TAP_TOKEN
          scripts/update-cask.py homebrew-tap/Casks/usbtether.rb "$VERSION" "$(cat "$RUNNER_TEMP/sha256")"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="$header"
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/usbtether.rb
          git diff --staged --quiet || git commit -m "usbtether v$VERSION"
          for _ in 1 2 3; do
            git push origin HEAD && exit 0
            git pull --rebase
          done
          echo "Failed to push cask update after 3 attempts" >&2
          exit 1
